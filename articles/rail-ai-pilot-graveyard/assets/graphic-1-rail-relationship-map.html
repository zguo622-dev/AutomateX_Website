<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{--orange:#F96532;--orange-light:#FB7B3A;--navy-deep:#0D1117;--card:#161B22;--white:#FFFFFF;--gray-400:#9CA3AF;--grad:linear-gradient(100deg,var(--orange-light),var(--orange),#ED4A3B);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#33373d;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Open Sans',sans-serif;}
  .card{width:1280px;height:720px;flex:none;background:var(--navy-deep);color:var(--white);position:relative;overflow:hidden;padding:54px 64px;}
  .card::before{content:"";position:absolute;top:-30%;right:-8%;width:680px;height:680px;background:radial-gradient(circle,rgba(249,101,50,0.16),transparent 62%);pointer-events:none;}
  .card::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:8px;background:var(--grad);}
  .eyebrow{font-family:'Montserrat',sans-serif;font-weight:600;font-size:14px;letter-spacing:3px;text-transform:uppercase;color:var(--orange-light);position:relative;}
  h2{font-family:'Montserrat',sans-serif;font-weight:700;font-size:38px;line-height:1.1;letter-spacing:-0.8px;margin:10px 0 8px;position:relative;}
  .sub{font-size:19px;color:#C7CBD4;position:relative;max-width:880px;}
  .stage{position:relative;margin-top:6px;}
  .note{position:absolute;left:64px;bottom:46px;padding-left:18px;border-left:4px solid var(--orange);font-family:'Montserrat',sans-serif;font-weight:500;font-size:21px;color:var(--white);}
  .footer{position:absolute;right:64px;bottom:42px;font-size:15px;color:var(--gray-400);}
  text.node{font-family:'Montserrat',sans-serif;font-weight:600;font-size:21px;fill:var(--white);}
  text.silo{font-family:'Open Sans',sans-serif;font-style:italic;font-size:15px;fill:#6b7589;}
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">The semantic gap</div>
    <h2>What a single hazard is actually connected to</h2>
    <p class="sub">Every link below is real. An experienced engineer holds the whole chain in their head.</p>
    <div class="stage">
      <svg width="1152" height="412" viewBox="0 0 1152 412" xmlns="http://www.w3.org/2000/svg">
        <!-- edges (real relationships) -->
        <g stroke="#3a4254" stroke-width="2">
          <line x1="150" y1="70" x2="420" y2="50"/>
          <line x1="420" y1="50" x2="690" y2="95"/>
          <line x1="690" y1="95" x2="970" y2="70"/>
          <line x1="970" y1="70" x2="1050" y2="250"/>
          <line x1="1050" y1="250" x2="690" y2="95"/>
          <line x1="150" y1="70" x2="560" y2="300"/>
          <line x1="560" y1="300" x2="420" y2="50"/>
          <line x1="230" y1="250" x2="690" y2="95"/>
          <line x1="560" y1="300" x2="690" y2="95"/>
        </g>
        <!-- silo labels (data lives scattered) -->
        <text class="silo" x="150" y="116" text-anchor="middle">hazard log</text>
        <text class="silo" x="420" y="96" text-anchor="middle">comment sheet</text>
        <text class="silo" x="690" y="140" text-anchor="middle">drawing register</text>
        <text class="silo" x="970" y="116" text-anchor="middle">condition feed</text>
        <text class="silo" x="1050" y="296" text-anchor="middle">standards portal (PDF)</text>
        <text class="silo" x="230" y="296" text-anchor="middle">spreadsheet</text>
        <text class="silo" x="560" y="346" text-anchor="middle">email thread</text>
        <!-- nodes -->
        <g>
          <rect x="90" y="48" width="120" height="44" rx="10" fill="#161B22" stroke="#F96532" stroke-width="2"/>
          <text class="node" x="150" y="74" text-anchor="middle">Hazard</text>
          <rect x="358" y="28" width="124" height="44" rx="10" fill="#161B22" stroke="#F96532" stroke-width="2"/>
          <text class="node" x="420" y="54" text-anchor="middle">Control</text>
          <rect x="635" y="73" width="110" height="44" rx="10" fill="#161B22" stroke="#F96532" stroke-width="2"/>
          <text class="node" x="690" y="99" text-anchor="middle">Asset</text>
          <rect x="888" y="48" width="164" height="44" rx="10" fill="#161B22" stroke="#F96532" stroke-width="2"/>
          <text class="node" x="970" y="74" text-anchor="middle">Possession</text>
          <rect x="980" y="228" width="140" height="44" rx="10" fill="#161B22" stroke="#F96532" stroke-width="2"/>
          <text class="node" x="1050" y="254" text-anchor="middle">Standard</text>
          <rect x="168" y="228" width="124" height="44" rx="10" fill="#161B22" stroke="#F96532" stroke-width="2"/>
          <text class="node" x="230" y="254" text-anchor="middle">Form G</text>
          <rect x="512" y="278" width="96" height="44" rx="10" fill="#161B22" stroke="#F96532" stroke-width="2"/>
          <text class="node" x="560" y="304" text-anchor="middle">IDC</text>
        </g>
      </svg>
    </div>
    <div class="note">None of it is modelled anywhere a machine can read.</div>
    <div class="footer">AutomateX Advisory &middot; automatex.uk</div>
  </div>
</body>
</html>
